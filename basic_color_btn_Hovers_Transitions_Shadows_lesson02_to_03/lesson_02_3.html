<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hovers,Transitions,Shadows</title>

  <style>

 /* Subscripb_button */
      .buton-subs{
        background-color:rgb(210, 3, 3);
        color:white;
        border:none;
        cursor: pointer;
        height: 35px;
        width:100px;
        border-radius: 3px;
        box-shadow: 10px 5px 10px rgb(0, 0, 0,0.15);
        transition: box-shadow 0.3s,background-color 0.3s,opacity 0.15s,color 20s;

      }


      .buton-subs:hover{
        background-color:rgb(216, 50, 44);
        color:black;
        opacity: 5;
      }

      .buton-subs:active{
        background-color:rgb(216, 50, 44);
        opacity: 0.3;
      }


 /* join_button */
      .buton-join{
        background-color:rgb(255, 253, 253);
        color:rgb(23, 106, 189);
        border:none;
        border-style:solid;
        cursor: pointer;
        border-color: rgb(23, 106, 189);
        border-radius: 3px;
        border-width: 1px;
        height: 35px;
        width:60px;
        margin-left:10px;
        transition:0.7s
      }

      .buton-join:hover{

        color:rgb(255, 253, 253);
        background-color:rgb(23, 106, 189);
        
      }

  /*tweet_button */
      .buton-twe{
        background-color:rgba(12, 63, 215, 0.756);
        color:white;
        border:none;
        cursor: pointer;
        height: 35px;
        width:100px;
        border-radius: 60px;
        font-weight: bold;
        margin-left:10px;
        transition: box-shadow 0.2s;
  
      }

      .buton-twe:hover{

        box-shadow: 5px 5px 10px rgb(0, 0, 0,0.15)

      }



      footer {
        bottom:0;
        text-align:center;
        margin:150px 0px 0px 10px;
      }

  </style>

</head>
  <body>

    <header>
      <h1>First button in try my self !!!</h1>
    </header>


  <main>

      <sector>  
        <button class="buton-subs">SUBSCRIBE</button> 
          <button class="buton-join">JOIN</button> 
        <button class="buton-twe">Tweet</button>
      </sector>

      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>
      <br>

      

  </main>

  </body>
</html>
